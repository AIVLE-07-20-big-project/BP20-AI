name: AI CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "rag/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "ruff.toml"
      - "Dockerfile"
      - ".github/workflows/ai-ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "rag/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "ruff.toml"
      - "Dockerfile"
      - ".github/workflows/ai-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # 운영 컨테이너와 동일하게 S3·DB를 쓰지 않는 상태로 테스트한다.
  # S3_BUCKET_NAME이 비면 object_storage.enabled()가 False가 되어 외부 호출이 없다.
  S3_BUCKET_NAME: ""
  AI_DB_HOST: ""
  HF_AUTO_DOWNLOAD_ASSETS: "false"
  ABSA_ENABLED: "false"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 무거운 런타임 의존성 없이 린트만 돌려 빠르게 실패시킨다.
      - name: Install ruff
        run: pip install ruff==0.12.0

      - name: Run ruff
        run: ruff check app tests

  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # torch 기본 wheel은 CUDA 번들이라 2GB가 넘는다. Dockerfile과 동일하게 CPU 전용으로 고정한다.
      # pytest는 런타임에 필요 없으므로 requirements.txt에 넣지 않고 여기서만 설치한다.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest

      # integration 마커는 실제 data/·model/ 산출물이 필요하다(pytest.ini 참고).
      # CI에는 그 자산이 없으므로 제외한다.
      - name: Run tests
        run: pytest -m "not integration" --maxfail=1 -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 이미지가 크므로 의존성 변경이 있을 때만 검증한다.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'docker')

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      # push는 하지 않고 빌드만 검증한다. 배포는 ai-deploy.yml이 담당한다.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
